name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install maturin
        run: uv tool install maturin

      # qt-build-utils downloads a minimal Qt whose tools (qtpaths) link these system
      # libraries; without them every q-qt build script panics. See README prerequisites.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdouble-conversion3 libpcre2-16-0 libglib2.0-0t64

      # Same pipeline the pre-push hook runs, so local and remote CI cannot drift.
      - name: Run validation suite
        run: ./scripts/ci.sh
